[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand     = "sh -c 'cd apps/api && npx prisma migrate deploy && node dist/index.js'"
healthcheckPath  = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

numReplicas = 1

[[deploy.envVarRef]]
name = "PORT"
value = "4000"
