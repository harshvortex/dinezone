databases:
  - name: dinespot-db
    plan: free
    postgresMajorVersion: "16"
    region: singapore

services:
  # Redis for queues/sockets
  - type: redis
    name: dinespot-redis
    plan: free
    ipAllowList: []

  # Fastify API Server
  - type: web
    name: dinespot-api
    env: node
    plan: free
    buildCommand: "npm install -g pnpm && pnpm install && pnpm --filter @dinespot/api db:generate && pnpm --filter @dinespot/api build"
    startCommand: "cd apps/api && pnpm db:migrate:prod && pnpm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dinespot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: dinespot-redis
          property: connectionString
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      # Add your Cloudinary, Razorpay, or Twilio keys in the Render Dashboard manually
      - key: CLOUDINARY_URL
        value: "fill-me-in"
