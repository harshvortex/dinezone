version: "3.9"

# ═══════════════════════════════════════════════════════
#  DineSpot — Local Development Infrastructure
#  Services: PostgreSQL 16 + PostGIS, Redis 7, pgAdmin, RedisInsight
#
#  Usage:
#    pnpm docker:up        → start all services (detached)
#    pnpm docker:down      → stop all services
#    pnpm docker:logs      → tail logs
#    pnpm docker:reset     → nuke volumes + restart fresh
# ═══════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────
  # PostgreSQL 16 with PostGIS 3.4 extension
  # Handles: restaurant data, user accounts,
  #          bookings, spatial queries (nearby search)
  # ─────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: dinespot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-dinespot_db}
      POSTGRES_USER: ${DATABASE_USER:-dinespot}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-dinespot_secret}
      # Increase shared buffers for spatial query performance
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-dinespot} -d ${DATABASE_NAME:-dinespot_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - dinespot_net
    command: >
      postgres
        -c shared_buffers=256MB
        -c work_mem=64MB
        -c maintenance_work_mem=128MB
        -c max_connections=100
        -c wal_level=replica
        -c log_statement=ddl
        -c log_duration=off
        -c log_min_duration_statement=500

  # ─────────────────────────────────────────
  # Redis 7 — Cache, Session Store & BullMQ Job Queue
  # ─────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: dinespot_redis
    restart: unless-stopped
    command: >
      redis-server
        --requirepass "${REDIS_PASSWORD:-dinespot_secret}"
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --appendonly yes
        --appendfsync everysec
        --save 60 1000
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dinespot_net

  # ─────────────────────────────────────────
  # pgAdmin 4 — Postgres GUI
  # Access: http://localhost:5050
  # Login:  admin@dinespot.local / admin
  # ─────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: dinespot_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dinespot.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dinespot_net
    profiles:
      - tools  # start only with: docker compose --profile tools up

  # ─────────────────────────────────────────
  # RedisInsight — Redis GUI
  # Access: http://localhost:8001
  # ─────────────────────────────────────────
  redisinsight:
    image: redis/redisinsight:2
    container_name: dinespot_redisinsight
    restart: unless-stopped
    ports:
      - "8001:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dinespot_net
    profiles:
      - tools  # start only with: docker compose --profile tools up

# ─────────────────────────────────────────
# Named volumes (data persists across restarts)
# ─────────────────────────────────────────
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  pgadmin_data:
    driver: local
  redisinsight_data:
    driver: local

# ─────────────────────────────────────────
# Internal network
# ─────────────────────────────────────────
networks:
  dinespot_net:
    driver: bridge
    name: dinespot_network
